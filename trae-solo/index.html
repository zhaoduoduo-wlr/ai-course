<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Trae SOLO 零基础实操课 — 40页完整版</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#000;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.header{background:linear-gradient(135deg,#0d1b2a,#1b2838);padding:12px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #1e3a5f;flex-shrink:0;transition:opacity .4s,transform .4s;z-index:100}
.header .logo{font-size:18px}
.header h2{font-size:15px;font-weight:500;color:#64b5f6}
.header.hidden{opacity:0;transform:translateY(-100%);pointer-events:none}
.version{color:#546e7a;font-size:11px;margin-left:auto}
.main{flex:1;display:flex;align-items:center;justify-content:center;padding:0;background:#000;position:relative}
.slide{position:absolute;inset:0;opacity:0;background-size:contain;background-position:center;background-repeat:no-repeat;pointer-events:none;transition:opacity .3s}
.slide.active{opacity:1;pointer-events:auto}
.controls{background:rgba(13,27,42,0.95);padding:14px 20px;display:flex;align-items:center;justify-content:center;gap:12px;border-top:1px solid #1e3a5f;flex-shrink:0;transition:opacity .4s,transform .4s;z-index:100;position:relative}
.controls.hidden{opacity:0;transform:translateY(100%);pointer-events:none}
.controls button{background:#1a3350;border:1px solid #2a5080;color:#90caf9;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13px;transition:all .2s}
.controls button:hover{background:#244878;border-color:#64b5f6}
.controls button:disabled{opacity:.3;cursor:default}
.controls button.play-btn{background:#1565c0;border-color:#1976d2;color:#fff;font-size:16px;padding:10px 24px;border-radius:10px}
.speed-group{display:flex;gap:3px}.speed-btn{padding:5px 10px!important;font-size:11px!important;min-width:38px}
.speed-btn.active-speed{background:#1565c0!important;border-color:#2196f3!important;color:#fff!important}
.progress{width:100px;height:14px;background:#1e3050;border-radius:7px;overflow:hidden;cursor:pointer;min-width:100px}
.progress-bar{height:4px;background:#2196f3;width:0;transition:width .1s linear;border-radius:2px}
.audio-status{font-size:11px;color:#546e7a;min-width:60px;text-align:center}
.page-nav{display:flex;align-items:center;gap:8px}
.page-nav span{font-size:13px;color:#90caf9;min-width:45px;text-align:center}
.page-slider{-webkit-appearance:none;width:120px;height:5px;background:#1e3050;border-radius:3px;outline:none;cursor:pointer}
.page-slider::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#2196f3;cursor:pointer;border:2px solid #64b5f6}
</style>
</head>
<body>
<div class="header">
  <div class="logo">🤖</div>
  <h2>Trae SOLO 零基础实操课</h2>
  <span class="version">v4.8 · 40页完整版 · 懒加载优化</span>
</div>
<div class="main" id="main-area" onclick="handleSlideTap(event)">
  <div class="slide" id="slide-01" style="background-image:url('slides_img/slide_01.png')"></div>
  <div class="slide" id="slide-02" style="background-image:url('slides_img/slide_02.png')"></div>
  <div class="slide" id="slide-03" style="background-image:url('slides_img/slide_03.png')"></div>
  <div class="slide" id="slide-04" style="background-image:url('slides_img/slide_04.png')"></div>
  <div class="slide" id="slide-05" style="background-image:url('slides_img/slide_05.png')"></div>
  <div class="slide" id="slide-06" data-src="slides_img/slide_06.png"></div>
  <div class="slide" id="slide-07" data-src="slides_img/slide_07.png"></div>
  <div class="slide" id="slide-08" data-src="slides_img/slide_08.png"></div>
  <div class="slide" id="slide-09" data-src="slides_img/slide_09.png"></div>
  <div class="slide" id="slide-10" data-src="slides_img/slide_10.png"></div>
  <div class="slide" id="slide-11" data-src="slides_img/slide_11.png"></div>
  <div class="slide" id="slide-12" data-src="slides_img/slide_12.png"></div>
  <div class="slide" id="slide-13" data-src="slides_img/slide_13.png"></div>
  <div class="slide" id="slide-14" data-src="slides_img/slide_14.png"></div>
  <div class="slide" id="slide-15" data-src="slides_img/slide_15.png"></div>
  <div class="slide" id="slide-16" data-src="slides_img/slide_16.png"></div>
  <div class="slide" id="slide-17" data-src="slides_img/slide_17.png"></div>
  <div class="slide" id="slide-18" data-src="slides_img/slide_18.png"></div>
  <div class="slide" id="slide-19" data-src="slides_img/slide_19.png"></div>
  <div class="slide" id="slide-20" data-src="slides_img/slide_20.png"></div>
  <div class="slide" id="slide-21" data-src="slides_img/slide_21.png"></div>
  <div class="slide" id="slide-22" data-src="slides_img/slide_22.png"></div>
  <div class="slide" id="slide-23" data-src="slides_img/slide_23.png" style="display:none"></div>
  <div class="slide" id="slide-24" data-src="slides_img/slide_24.png"></div>
  <div class="slide" id="slide-25" data-src="slides_img/slide_25.png"></div>
  <div class="slide" id="slide-26" data-src="slides_img/slide_26.png"></div>
  <div class="slide" id="slide-27" data-src="slides_img/slide_27.png"></div>
  <div class="slide" id="slide-28" data-src="slides_img/slide_28.png"></div>
  <div class="slide" id="slide-29" data-src="slides_img/slide_29.png"></div>
  <div class="slide" id="slide-30" data-src="slides_img/slide_30.png"></div>
  <div class="slide" id="slide-31" data-src="slides_img/slide_31.png"></div>
  <div class="slide" id="slide-32" data-src="slides_img/slide_32.png"></div>
  <div class="slide" id="slide-33" data-src="slides_img/slide_33.png"></div>
  <div class="slide" id="slide-34" data-src="slides_img/slide_34.png"></div>
  <div class="slide" id="slide-35" data-src="slides_img/slide_35.png"></div>
  <div class="slide" id="slide-36" data-src="slides_img/slide_36.png"></div>
  <div class="slide" id="slide-37" data-src="slides_img/slide_37.png"></div>
  <div class="slide" id="slide-38" data-src="slides_img/slide_38.png"></div>
  <div class="slide" id="slide-39" data-src="slides_img/slide_39.png"></div>
  <div class="slide" id="slide-40" data-src="slides_img/slide_40.png"></div>
</div>
<div class="controls" id="controls-bar">
  <button onclick="prevSlide()" id="btn-prev">◀</button>
  <button class="play-btn" onclick="togglePlay()" id="btn-play">▶ 播放</button>
  <button onclick="nextSlide()" id="btn-next">▶</button>
  <div class="speed-group">
    <button class="speed-btn active-speed" onclick="setSpeed(1)" id="spd-1">1x</button>
    <button class="speed-btn" onclick="setSpeed(1.2)" id="spd-1.2">1.2x</button>
    <button class="speed-btn" onclick="setSpeed(1.5)" id="spd-1.5">1.5x</button>
    <button class="speed-btn" onclick="setSpeed(2)" id="spd-2">2x</button>
  </div>
  <div class="progress" id="progress-wrap"><div class="progress-bar" id="progress-bar"></div></div>
  <span class="audio-status" id="audio-status">⏸</span>
  <div class="page-nav">
    <span id="page-label">1/40</span>
    <input type="range" id="page-slider" min="1" max="40" value="1" class="page-slider">
  </div>
</div>
<audio id="audio-player" preload="none"></audio>
<audio id="audio-preload" preload="none" style="display:none"></audio>
<script>
const TOTAL=40;let current=1,isPlaying=false,currentSpeed=1;
let audio=document.getElementById('audio-player');
let preload=document.getElementById('audio-preload');
let slider=document.getElementById('page-slider');
let pageLabel=document.getElementById('page-label');
let lastTimeUpdate=0;

// === 多课件互斥机制 ===
const COURSE_ID='trae-solo-40';
window.addEventListener('storage',function(e){
  if(e.key==='ai-course-playing'&&e.newValue&&e.newValue!==COURSE_ID&&isPlaying){
    audio.pause();isPlaying=false;updatePlayBtn();
    document.getElementById('audio-status').textContent='⏸';
    document.getElementById('progress-bar').style.width='0%';
  }
});
function signalPlaying(){
  try{localStorage.setItem('ai-course-playing',COURSE_ID);}catch(e){}
}
function signalStopped(){
  try{localStorage.removeItem('ai-course-playing');}catch(e){}
}

// === 图片懒加载 ===
const imgCache={};
function lazyLoadImg(n){
  if(n<1||n>TOTAL)return;
  if(imgCache[n])return;
  let slide=document.getElementById('slide-'+String(n).padStart(2,'0'));
  if(!slide||slide.style.backgroundImage)return;
  let src=slide.getAttribute('data-src');
  if(!src)return;
  let img=new Image();
  img.onload=function(){
    imgCache[n]=true;
    slide.style.backgroundImage='url('+src+')';
    slide.removeAttribute('data-src');
  };
  img.onerror=function(){imgCache[n]=false;};
  img.src=src;
}

// === 音频 ===
function src(n){return'audio/slide_'+String(n).padStart(2,'0')+'.mp3';}
function preloadAudio(n){
  if(n<1||n>TOTAL)return;
  preload.src=src(n);preload.load();
}
slider.addEventListener('input',function(){
  let n=parseInt(slider.value);
  if(n!==current)goTo(n);
});
document.getElementById('progress-wrap').addEventListener('click',function(e){
  if(!audio.duration)return;
  let rect=e.target.closest('.progress').getBoundingClientRect();
  audio.currentTime=((e.clientX-rect.left)/rect.width)*audio.duration;
});

function showSlide(n){
  document.querySelectorAll('.slide').forEach(function(s){s.classList.remove('active');});
  let slide=document.getElementById('slide-'+String(n).padStart(2,'0'));
  if(slide)slide.classList.add('active');
  document.getElementById('btn-prev').disabled=(n<=1);
  document.getElementById('btn-next').disabled=(n>=TOTAL);
  slider.value=n;pageLabel.textContent=n+'/'+TOTAL;current=n;
  // 懒加载当前+前后各1页
  lazyLoadImg(n);
  if(n<TOTAL)lazyLoadImg(n+1);
  if(n>1)lazyLoadImg(n-1);
}

function goTo(n){
  if(n===23) n=(n>current)?24:22;
  if(n<1||n>40)return;
  let wasPlaying=isPlaying;
  audio.pause();isPlaying=false;updatePlayBtn();
  document.getElementById('audio-status').textContent='⏸';
  document.getElementById('progress-bar').style.width='0%';
  showSlide(n);
  // 预加载音频
  audio.src=src(n);audio.load();preloadAudio(n+1);
  if(wasPlaying)setTimeout(function(){playCurrent();},500);
}

function prevSlide(){goTo(current-1);}
function nextSlide(){goTo(current+1);}

function togglePlay(){
  if(isPlaying){
    audio.pause();isPlaying=false;
    document.getElementById('audio-status').textContent='⏸';
    updatePlayBtn();signalStopped();
  }else playCurrent();
}

function playCurrent(){
  if(current===23){current=24;}
  audio.src=src(current);audio.load();
  audio.playbackRate=currentSpeed;
  audio.play().then(function(){
    isPlaying=true;updatePlayBtn();signalPlaying();
    document.getElementById('audio-status').textContent='🔊 '+audio.playbackRate.toFixed(1)+'x';
    preloadAudio(current+1);
  }).catch(function(e){
    document.getElementById('audio-status').textContent='❌';
    isPlaying=false;updatePlayBtn();
  });
}

function updatePlayBtn(){document.getElementById('btn-play').textContent=isPlaying?'⏸ 暂停':'▶ 播放';}
function setSpeed(rate){
  currentSpeed=rate;audio.playbackRate=rate;
  document.querySelectorAll('.speed-btn').forEach(function(b){b.classList.remove('active-speed');});
  let btn=document.getElementById('spd-'+rate);if(btn)btn.classList.add('active-speed');
  if(isPlaying)document.getElementById('audio-status').textContent='🔊 '+rate.toFixed(1)+'x';
}

audio.addEventListener('timeupdate',function(){
  if(Date.now()-lastTimeUpdate<250)return;
  lastTimeUpdate=Date.now();
  if(audio.duration){
    document.getElementById('progress-bar').style.width=(audio.currentTime/audio.duration*100)+'%';
    let s=Math.floor(audio.currentTime),m=Math.floor(s/60);s%=60;
    document.getElementById('audio-status').textContent='🔊 '+m+':'+String(s).padStart(2,'0')+' '+audio.playbackRate.toFixed(1)+'x';
  }
});

audio.addEventListener('ended',function(){
  if(current<TOTAL){current++;if(current===23)current=24;showSlide(current);setTimeout(function(){playCurrent();},500);}
  else{isPlaying=false;updatePlayBtn();signalStopped();document.getElementById('audio-status').textContent='✅ 完成';document.getElementById('progress-bar').style.width='100%';}
});

audio.addEventListener('error',function(){document.getElementById('audio-status').textContent='❌';isPlaying=false;updatePlayBtn();signalStopped();});

document.addEventListener('keydown',function(e){
  if(e.key==='ArrowLeft')prevSlide();if(e.key==='ArrowRight')nextSlide();
  if(e.key===' '){e.preventDefault();togglePlay();}
  if(e.key==='1')setSpeed(1);if(e.key==='2')setSpeed(1.2);if(e.key==='3')setSpeed(1.5);if(e.key==='4')setSpeed(2);
});

let hideTimer,ctrls=document.querySelector('.controls'),hdr=document.querySelector('.header');
function showCtrls(){
  ctrls.classList.remove('hidden');hdr.classList.remove('hidden');
  if(hideTimer)clearTimeout(hideTimer);
  if(isPlaying)hideTimer=setTimeout(function(){ctrls.classList.add('hidden');hdr.classList.add('hidden');},3000);
}
let _mc=0;
document.addEventListener('mousemove',function(){if(Date.now()-_mc>300){_mc=Date.now();showCtrls();}});
ctrls.addEventListener('mouseenter',function(){if(hideTimer)clearTimeout(hideTimer);});
ctrls.addEventListener('mouseleave',function(){if(isPlaying)hideTimer=setTimeout(function(){ctrls.classList.add('hidden');hdr.classList.add('hidden');},1000);});
let _p=playCurrent;playCurrent=function(){_p();setTimeout(function(){if(isPlaying)hideTimer=setTimeout(function(){ctrls.classList.add('hidden');hdr.classList.add('hidden');},3000);},100);};
let _t=togglePlay;togglePlay=function(){_t();if(!isPlaying)showCtrls();else setTimeout(function(){hideTimer=setTimeout(function(){ctrls.classList.add('hidden');hdr.classList.add('hidden');},3000);},100);};
function handleSlideTap(e){
  let w=e.target.closest('.main').offsetWidth;
  if(e.clientX<w*0.3)prevSlide();
  else if(e.clientX>w*0.7)nextSlide();
  else togglePlay();
}
showSlide(1);
// 初始懒加载前几页
for(let i=2;i<=Math.min(7,TOTAL);i++)lazyLoadImg(i);
setTimeout(function(){ctrls.classList.add('hidden');hdr.classList.add('hidden');},3000);
</script>
</body>
</html>
