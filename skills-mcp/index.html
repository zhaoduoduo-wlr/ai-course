<script>
const TOTAL=26,COURSE_ID='ai-course-skills';
let current=1,isPlaying=false,currentSpeed=1;

const mutexChannel=(function(){
  try{let ch=new BroadcastChannel('ai-course-mutex');
    ch.onmessage=function(e){if(e.data==='stop-others'&&isPlaying){audio.pause();isPlaying=false;updatePlayBtn();document.getElementById('audio-status').textContent='⏸';document.getElementById('progress-bar').style.width='0%';}};
    return ch;}catch(e){return null;}
})();
function signalPlaying(){try{localStorage.setItem('ai-course-playing',COURSE_ID);}catch(e){}if(mutexChannel){try{mutexChannel.postMessage('stop-others');}catch(e){}}}
function signalStopped(){try{localStorage.removeItem('ai-course-playing');}catch(e){}}
window.addEventListener('storage',function(e){if(e.key==='ai-course-playing'&&e.newValue&&e.newValue!==COURSE_ID&&isPlaying){audio.pause();isPlaying=false;updatePlayBtn();document.getElementById('audio-status').textContent='⏸';document.getElementById('progress-bar').style.width='0%';}});

const imgCache={};
function lazyLoadImg(n){
  if(n<1||n>TOTAL)return;if(imgCache[n])return;
  let slide=document.getElementById('slide-'+String(n).padStart(2,'0'));
  if(!slide||slide.style.backgroundImage)return;
  let src=slide.getAttribute('data-src');if(!src)return;
  slide.style.backgroundImage='url('+src+')';slide.removeAttribute('data-src');
  let img=new Image();img.onload=function(){imgCache[n]=true;};img.onerror=function(){imgCache[n]=true;};img.src=src;
}
let audio=document.getElementById('audio-player');
let slider=document.getElementById('page-slider');
let pageLabel=document.getElementById('page-label');
slider.addEventListener('input',()=>{goTo(parseInt(slider.value));});
document.getElementById('progress-wrap').addEventListener('click',(e)=>{
  if(!audio.duration)return;
  let rect=e.target.closest('.progress').getBoundingClientRect();
  audio.currentTime=((e.clientX-rect.left)/rect.width)*audio.duration;
});
function showSlide(n){
  document.querySelectorAll('.slide').forEach(s=>s.classList.remove('active'));
  let slide=document.getElementById('slide-'+String(n).padStart(2,'0'));
  if(slide)slide.classList.add('active');
  document.getElementById('btn-prev').disabled=(n<=1);
  document.getElementById('btn-next').disabled=(n>=TOTAL);
  slider.value=n;pageLabel.textContent=n+'/'+TOTAL;current=n;
  lazyLoadImg(n);if(n<TOTAL)lazyLoadImg(n+1);if(n>1)lazyLoadImg(n-1);
}
function goTo(n){
  if(n<1||n>TOTAL)return;
  let wasPlaying=isPlaying;audio.pause();isPlaying=false;updatePlayBtn();signalStopped();
  document.getElementById('audio-status').textContent='⏸';
  document.getElementById('progress-bar').style.width='0%';
  showSlide(n);if(wasPlaying)setTimeout(()=>playCurrent(),500);
}
function prevSlide(){goTo(current-1);}
function nextSlide(){goTo(current+1);}
function togglePlay(){
  if(isPlaying){audio.pause();isPlaying=false;document.getElementById('audio-status').textContent='⏸';updatePlayBtn();signalStopped();}
  else playCurrent();
}
function playCurrent(){
  audio.src='audio/slide_'+String(current).padStart(2,'0')+'.mp3';
  audio.load();audio.playbackRate=currentSpeed;
  audio.play().then(()=>{
    isPlaying=true;updatePlayBtn();signalPlaying();
    document.getElementById('audio-status').textContent='🔊 '+audio.playbackRate.toFixed(1)+'x';
  }).catch(e=>{
    document.getElementById('audio-status').textContent='❌';isPlaying=false;updatePlayBtn();
  });
}
function updatePlayBtn(){document.getElementById('btn-play').textContent=isPlaying?'⏸ 暂停':'▶ 播放';}
function setSpeed(rate){
  currentSpeed=rate;audio.playbackRate=rate;
  document.querySelectorAll('.speed-btn').forEach(b=>b.classList.remove('active-speed'));
  let btn=document.getElementById('spd-'+rate);if(btn)btn.classList.add('active-speed');
  if(isPlaying)document.getElementById('audio-status').textContent='🔊 '+rate.toFixed(1)+'x';
}
audio.addEventListener('timeupdate',()=>{
  if(audio.duration){
    document.getElementById('progress-bar').style.width=(audio.currentTime/audio.duration*100)+'%';
    let s=Math.floor(audio.currentTime),m=Math.floor(s/60);s%=60;
    document.getElementById('audio-status').textContent='🔊 '+m+':'+String(s).padStart(2,'0')+' '+audio.playbackRate.toFixed(1)+'x';
  }
});
audio.addEventListener('ended',()=>{
  if(current<TOTAL){current++;showSlide(current);setTimeout(()=>playCurrent(),500);}
  else{isPlaying=false;updatePlayBtn();document.getElementById('audio-status').textContent='✅ 完成';document.getElementById('progress-bar').style.width='100%';}
});
audio.addEventListener('error',()=>{document.getElementById('audio-status').textContent='❌';isPlaying=false;updatePlayBtn();});
document.addEventListener('keydown',(e)=>{
  if(e.key==='ArrowLeft')prevSlide();if(e.key==='ArrowRight')nextSlide();
  if(e.key===' '){e.preventDefault();togglePlay();}
  if(e.key==='1')setSpeed(1);if(e.key==='2')setSpeed(1.2);if(e.key==='3')setSpeed(1.5);if(e.key==='4')setSpeed(2);
});
let hideTimer,ctrls=document.querySelector('.controls'),hdr=document.querySelector('.header');
function showCtrls(){
  ctrls.classList.remove('hidden');hdr.classList.remove('hidden');
  if(hideTimer)clearTimeout(hideTimer);
  if(isPlaying)hideTimer=setTimeout(()=>{ctrls.classList.add('hidden');hdr.classList.add('hidden');},3000);
}
let _mc=0;
document.addEventListener('mousemove',()=>{if(Date.now()-_mc>200){_mc=Date.now();showCtrls();}});
ctrls.addEventListener('mouseenter',()=>{if(hideTimer)clearTimeout(hideTimer);});
ctrls.addEventListener('mouseleave',()=>{if(isPlaying)hideTimer=setTimeout(()=>{ctrls.classList.add('hidden');hdr.classList.add('hidden');},1000);});
let _p=playCurrent;playCurrent=function(){_p();setTimeout(()=>{if(isPlaying)hideTimer=setTimeout(()=>{ctrls.classList.add('hidden');hdr.classList.add('hidden');},3000);},100);};
let _t=togglePlay;togglePlay=function(){_t();if(!isPlaying)showCtrls();else setTimeout(()=>{hideTimer=setTimeout(()=>{ctrls.classList.add('hidden');hdr.classList.add('hidden');},3000);},100);};
showSlide(1);lazyLoadImg(1);lazyLoadImg(2);lazyLoadImg(3);setTimeout(()=>{ctrls.classList.add('hidden');hdr.classList.add('hidden');},3000);
</script>
</body>
</html>
