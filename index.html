<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>AI技术底层逻辑 — 微课 v4.4b · 修复手机播放版</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#000;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.header{background:linear-gradient(135deg,#0d1b2a,#1b2838);padding:12px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #1e3a5f;flex-shrink:0;transition:opacity .4s,transform .4s;z-index:100}
.header .logo{font-size:18px}
.header h2{font-size:15px;font-weight:500;color:#64b5f6}
.header.hidden{opacity:0;transform:translateY(-100%);pointer-events:none}
.version{color:#546e7a;font-size:11px;margin-left:auto}
.main{flex:1;display:flex;align-items:center;justify-content:center;padding:0;background:#000;position:relative}
.slide{position:absolute;inset:0;background-size:contain;background-position:center;background-repeat:no-repeat;opacity:0;transition:opacity .3s}
.slide.active{opacity:1}
.controls{background:rgba(13,27,42,0.95);padding:14px 20px;display:flex;align-items:center;justify-content:center;gap:12px;border-top:1px solid #1e3a5f;flex-shrink:0;transition:opacity .4s,transform .4s;z-index:100;position:relative;flex-wrap:wrap}
.controls.hidden{opacity:0;transform:translateY(100%);pointer-events:none}
.controls button{background:#1a3350;border:1px solid #2a5080;color:#90caf9;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13px;transition:all .2s}
.controls button:hover{background:#244878;border-color:#64b5f6}
.controls button:disabled{opacity:.3;cursor:default}
.controls button.play-btn{background:#1565c0;border-color:#1976d2;color:#fff;font-size:16px;padding:10px 24px;border-radius:10px}
.speed-group{display:flex;gap:3px}.speed-btn{padding:5px 10px!important;font-size:11px!important;min-width:38px}
.speed-btn.active-speed{background:#1565c0!important;border-color:#2196f3!important;color:#fff!important}
.progress{width:100px;height:14px;background:#1e3050;border-radius:7px;overflow:hidden;cursor:pointer}
.progress-bar{height:4px;background:#2196f3;width:0;transition:width .1s linear;border-radius:2px}
.audio-status{font-size:11px;color:#546e7a;min-width:50px;text-align:center}
.page-nav{display:flex;align-items:center;gap:8px}
.page-nav span{font-size:13px;color:#90caf9;min-width:30px;text-align:center}
.page-slider{-webkit-appearance:none;width:100px;height:5px;background:#1e3050;border-radius:3px;outline:none;cursor:pointer}
.page-slider::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#2196f3;cursor:pointer;border:2px solid #64b5f6}
.loading{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#64b5f6;font-size:18px;z-index:10}
</style>
</head>
<body>
<div class="header">
  <div class="logo">🏢</div>
  <h2>AI技术底层逻辑</h2>
  <span class="version">v4.4b · 修复手机播放</span>
</div>
<div class="main" id="main-area">
  <div class="loading" id="loading-hint">加载中...</div>
  <div class="slide active" id="slide-1"></div>
  <div class="slide" id="slide-2"></div>
  <div class="slide" id="slide-3"></div>
  <div class="slide" id="slide-4"></div>
  <div class="slide" id="slide-5"></div>
  <div class="slide" id="slide-6"></div>
  <div class="slide" id="slide-7"></div>
  <div class="slide" id="slide-8"></div>
  <div class="slide" id="slide-9"></div>
  <div class="slide" id="slide-10"></div>
  <div class="slide" id="slide-11"></div>
  <div class="slide" id="slide-12"></div>
  <div class="slide" id="slide-13"></div>
  <div class="slide" id="slide-14"></div>
  <div class="slide" id="slide-15"></div>
  <div class="slide" id="slide-16"></div>
  <div class="slide" id="slide-17"></div>
  <div class="slide" id="slide-18"></div>
</div>
<div class="controls" id="controls-bar">
  <button onclick="prevSlide()" id="btn-prev">◀</button>
  <button class="play-btn" onclick="togglePlay()" id="btn-play">▶ 播放</button>
  <button onclick="nextSlide()" id="btn-next">▶</button>
  <div class="speed-group">
    <button class="speed-btn active-speed" onclick="setSpeed(1)" id="spd-1">1x</button>
    <button class="speed-btn" onclick="setSpeed(1.2)" id="spd-1.2">1.2x</button>
    <button class="speed-btn" onclick="setSpeed(1.5)" id="spd-1.5">1.5x</button>
    <button class="speed-btn" onclick="setSpeed(2)" id="spd-2">2x</button>
  </div>
  <div class="progress" id="progress-wrap"><div class="progress-bar" id="progress-bar"></div></div>
  <span class="audio-status" id="audio-status">⏸</span>
  <div class="page-nav">
    <span id="page-label">1/18</span>
    <input type="range" id="page-slider" min="1" max="18" value="1" class="page-slider">
  </div>
</div>
<audio id="audio-player" preload="none"></audio>
<audio id="audio-preload" preload="none" style="display:none"></audio>

<script>
const TOTAL=18;
let current=1,isPlaying=false,currentSpeed=1;
let audio=document.getElementById('audio-player');
let preload=document.getElementById('audio-preload');
let slider=document.getElementById('page-slider');
let pageLabel=document.getElementById('page-label');
let statusEl=document.getElementById('audio-status');
let loadingEl=document.getElementById('loading-hint');

// ========== 图片懒加载：只加载当前页+预加载下一页 ==========
const imgCache={};

function loadSlideImg(n){
  if(n<1||n>TOTAL)return;
  if(imgCache[n])return; // 已缓存
  let slide=document.getElementById('slide-'+n);
  if(!slide||slide.style.backgroundImage)return; // 已加载
  let url='slides_v4.2/slide_'+String(n).padStart(2,'0')+'.png';
  // 创建隐藏img预加载
  let img=new Image();
  img.onload=function(){
    imgCache[n]=true;
    slide.style.backgroundImage='url('+url+')';
    if(n===current)loadingEl.style.display='none';
  };
  img.onerror=function(){
    // 失败也标记，避免反复重试
    imgCache[n]=true;
    if(n===current)loadingEl.style.display='none';
  };
  img.src=url;
}

// ========== 音频：手动加载，不自动预加载 ==========
function audioSrc(n){return 'audio/slide_'+String(n).padStart(2,'0')+'.mp3';}

function loadAudio(n){
  if(n<1||n>TOTAL)return;
  audio.src=audioSrc(n);
  audio.load();
}

function preloadNextAudio(n){
  if(n<1||n>TOTAL)return;
  // 用 preload 元素悄悄加载下一个音频
  if(preload.src!==audioSrc(n)){
    preload.src=audioSrc(n);
    preload.load();
  }
}

// 滑动条
slider.addEventListener('input',()=>{goTo(parseInt(slider.value));});

// 进度条点击
document.getElementById('progress-wrap').addEventListener('click',(e)=>{
  if(!audio.duration)return;
  let rect=e.target.closest('.progress').getBoundingClientRect();
  audio.currentTime=((e.clientX-rect.left)/rect.width)*audio.duration;
});
document.getElementById('progress-wrap').addEventListener('touchend',(e)=>{
  if(!audio.duration)return;
  let rect=e.target.closest('.progress').getBoundingClientRect();
  let x=e.changedTouches[0].clientX;
  audio.currentTime=((x-rect.left)/rect.width)*audio.duration;
});

function showSlide(n){
  document.querySelectorAll('.slide').forEach(s=>s.classList.remove('active'));
  let slide=document.getElementById('slide-'+n);
  if(slide){
    slide.classList.add('active');
    // 懒加载：当前页图片
    loadSlideImg(n);
    // 预加载下一页图片
    if(n<TOTAL)loadSlideImg(n+1);
  }
  document.getElementById('btn-prev').disabled=(n<=1);
  document.getElementById('btn-next').disabled=(n>=TOTAL);
  slider.value=n;pageLabel.textContent=n+'/'+TOTAL;current=n;
}

function goTo(n){
  if(n<1||n>TOTAL||n===current)return;
  let wasPlaying=isPlaying;
  audio.pause();isPlaying=false;updatePlayBtn();
  statusEl.textContent='⏸';
  document.getElementById('progress-bar').style.width='0%';
  showSlide(n);
  loadAudio(n);
  preloadNextAudio(n+1);
  if(wasPlaying)setTimeout(()=>playCurrent(),300);
}

function prevSlide(){if(current>1)goTo(current-1);}
function nextSlide(){if(current<TOTAL)goTo(current+1);}

function togglePlay(){
  if(isPlaying){audio.pause();isPlaying=false;statusEl.textContent='⏸';updatePlayBtn();}
  else playCurrent();
}

function playCurrent(){
  statusEl.textContent='⏳';updatePlayBtn();
  audio.playbackRate=currentSpeed;

  function doPlay(){
    audio.play().then(()=>{
      isPlaying=true;updatePlayBtn();
      statusEl.textContent='🔊 '+audio.playbackRate.toFixed(1)+'x';
      preloadNextAudio(current+1);
    }).catch(e=>{
      statusEl.textContent='❌ 点击播放';isPlaying=false;updatePlayBtn();
    });
  }

  // 如果音频已加载好，直接播
  if(audio.readyState>=2){ // HAVE_CURRENT_DATA
    doPlay();
    return;
  }

  // 否则等加载完成
  loadAudio(current);
  let fired=false;
  audio.addEventListener('canplaythrough',function h(){
    if(fired)return;fired=true;
    audio.removeEventListener('canplaythrough',h);
    doPlay();
  },{once:true});

  // 3秒超时保底
  setTimeout(()=>{
    if(!fired){fired=true;doPlay();}
  },3000);
}

function updatePlayBtn(){
  document.getElementById('btn-play').textContent=isPlaying?'⏸ 暂停':'▶ 播放';
}

function setSpeed(rate){
  currentSpeed=rate;audio.playbackRate=rate;
  document.querySelectorAll('.speed-btn').forEach(b=>b.classList.remove('active-speed'));
  let btn=document.getElementById('spd-'+rate);
  if(btn)btn.classList.add('active-speed');
  if(isPlaying)document.getElementById('audio-status').textContent='🔊 '+rate.toFixed(1)+'x';
}

// timeupdate 用 requestAnimationFrame 节流
let lastTimeUpdate=0;
audio.addEventListener('timeupdate',()=>{
  let now=Date.now();
  if(now-lastTimeUpdate<250)return; // 每秒最多4次
  lastTimeUpdate=now;
  if(audio.duration){
    document.getElementById('progress-bar').style.width=(audio.currentTime/audio.duration*100)+'%';
    let s=Math.floor(audio.currentTime),m=Math.floor(s/60);s%=60;
    // 只在变化时更新，减少DOM操作
  }
});

audio.addEventListener('ended',()=>{
  if(current<TOTAL){
    goTo(current+1);
    setTimeout(()=>{if(!isPlaying)playCurrent();},400);
  }else{
    isPlaying=false;updatePlayBtn();statusEl.textContent='✅ 完成';
    document.getElementById('progress-bar').style.width='100%';
  }
});

audio.addEventListener('error',()=>{
  statusEl.textContent='❌';isPlaying=false;updatePlayBtn();
});

// 键盘
document.addEventListener('keydown',(e)=>{
  if(e.key==='ArrowLeft')prevSlide();
  if(e.key==='ArrowRight')nextSlide();
  if(e.key===' '){e.preventDefault();togglePlay();}
  if(e.key==='1')setSpeed(1);if(e.key==='2')setSpeed(1.2);
  if(e.key==='3')setSpeed(1.5);if(e.key==='4')setSpeed(2);
});

// 触摸滑动
let touchStartX=0,touchStartY=0;
document.addEventListener('touchstart',(e)=>{touchStartX=e.touches[0].clientX;touchStartY=e.touches[0].clientY;},{passive:true});
document.addEventListener('touchend',(e)=>{
  let dx=e.changedTouches[0].clientX-touchStartX;
  let dy=e.changedTouches[0].clientY-touchStartY;
  if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>40){
    dx>0?prevSlide():nextSlide();
  }
});

// 点击主区域
let mainArea=document.getElementById('main-area');
mainArea.addEventListener('click',function(e){
  if(e.target.closest('.controls'))return;
  if(e.target.closest('button'))return;
  let rect=mainArea.getBoundingClientRect();
  let x=e.clientX-rect.left;
  if(x<rect.width*.25)prevSlide();
  else if(x>rect.width*.75)nextSlide();
  else togglePlay();
});

// Header/Controls 自动隐藏
let hideTimer,ctrls=document.getElementById('controls-bar'),hdr=document.querySelector('.header');
function showCtrls(){
  ctrls.classList.remove('hidden');hdr.classList.remove('hidden');
  if(hideTimer)clearTimeout(hideTimer);
  if(isPlaying)hideTimer=setTimeout(()=>{ctrls.classList.add('hidden');hdr.classList.add('hidden');},3000);
}
let _mc=0;
document.addEventListener('mousemove',()=>{
  let now=Date.now();
  if(now-_mc>300){_mc=now;showCtrls();}
});
ctrls.addEventListener('mouseenter',()=>{if(hideTimer)clearTimeout(hideTimer);});
ctrls.addEventListener('mouseleave',()=>{
  if(isPlaying)hideTimer=setTimeout(()=>{ctrls.classList.add('hidden');hdr.classList.add('hidden');},1000);
});

// ========== 初始化：只加载第1页 ==========
loadSlideImg(1);   // 加载第1张图
loadAudio(1);      // 加载第1个音频
showSlide(1);
setTimeout(()=>{ctrls.classList.add('hidden');hdr.classList.add('hidden');},3000);
</script>
</body>
</html>
