<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>微课堂</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:linear-gradient(135deg,#0d1b2a,#1b2838);color:#90caf9;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 20px}
h1{font-size:28px;color:#64b5f6;margin-bottom:8px}
.sub{color:#546e7a;font-size:14px;margin-bottom:40px}
.cards{display:flex;flex-wrap:wrap;gap:20px;max-width:600px;justify-content:center}
.card{background:rgba(26,51,80,0.6);border:1px solid #2a5080;border-radius:12px;padding:24px;width:280px;cursor:pointer;transition:all .3s;text-decoration:none;color:inherit}
.card:hover{background:rgba(36,72,120,0.8);border-color:#64b5f6;transform:translateY(-2px)}
.card h2{font-size:18px;color:#fff;margin-bottom:8px}
.card p{font-size:13px;color:#78909c}
.card .tag{display:inline-block;background:#1565c0;color:#fff;padding:2px 8px;border-radius:4px;font-size:11px;margin-top:10px}
</style>
</head>
<body>
<h1>📚 微课堂</h1>
<p class="sub">点击课件开始学习</p>
<div class="cards">
  <a class="card" href="AI技术底层逻辑/">
    <h2>AI技术底层逻辑</h2>
    <p>18节微课 · 带你搞懂AI是怎么工作的</p>
    <span class="tag">v4.7</span>
  </a>
</div>
</body>
</html>
