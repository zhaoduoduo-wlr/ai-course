<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AI 微课导航</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d1117;color:#c9d1d9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
.container{max-width:800px;width:90%;padding:40px 20px}
h1{font-size:2em;margin-bottom:8px;color:#58a6ff}
.sub{color:#8b949e;margin-bottom:32px;font-size:0.95em}
.courses{display:flex;flex-direction:column;gap:16px}
.course{display:block;background:#161b22;border:1px solid #30363d;border-radius:12px;padding:20px 24px;text-decoration:none;transition:all .2s}
.course:hover{border-color:#58a6ff;background:#1c2333}
.course h2{color:#e6edf3;font-size:1.2em;margin-bottom:4px}
.course p{color:#8b949e;font-size:0.9em}
.badge{display:inline-block;background:#23863622;color:#3fb950;border:1px solid #23863644;border-radius:6px;padding:2px 8px;font-size:0.75em;margin-left:8px;vertical-align:middle}
.footer{margin-top:40px;text-align:center;color:#484f58;font-size:0.8em}
</style>
</head>
<body>
<div class="container">
<h1>📚 AI 微课</h1>
<p class="sub">选择一个课件开始学习</p>
<div class="courses">
<a class="course" href="./trae-solo/">
<h2>🤖 Trae SOLO 零基础实操课 <span class="badge">40页</span></h2>
<p>AI编程工具 Trae 从零到上手，含实操演示与配音讲解</p>
</a>
<a class="course" href="./ai-logic/">
<h2>🧠 AI 技术底层逻辑 <span class="badge">18页</span></h2>
<p>理解 AI 背后的技术原理，大语言模型、神经网络基础</p>
</a>
</div>
<p class="footer">zhaoduoduo-wlr.github.io/ai-course</p>
</div>
</body>
</html>
